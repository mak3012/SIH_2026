# The stack. Production-shaped: TLS on every hop, no internet egress, secrets from the
# environment (.env generated by `make secrets`, or injected by the secret store).
#
#   docker compose up              base: what COMPOSE_PROFILES in .env selects
#   profiles   hq        ingestion (Dagster) and the observability stack (Prometheus, Grafana,
#                        Tempo, Loki) - headquarters
#              edge      Rig Edge Pack: local LLM (llama.cpp) and the sync agent - one rig box
#              realtime  WITSML simulator + real-time service (demo); the real-time service
#                        also runs in `edge`, against the rig's WITSML store
#              tools     one-shot data jobs (make seed)
#
# Laptops add docker-compose.dev.yml (COMPOSE_FILE in .env.example): host ports for DB tools,
# Ollama, and internet access for model pulls and public-data downloads.
# Details: docs/security.md, docs/operations/index.md, docs/operations/edge.md.

# ---------------------------------------------------------------- networks
networks:
  # Every service. `internal`: no route to the outside world (no egress, no published ports).
  backend:
    internal: true
  # The only network with a route out: the ingress proxy (published ports), the real-time
  # connector (the rig's WITSML store) and the edge sync agent (headquarters over VSAT).
  # infra/firewall/no-egress.sh drops every new outbound connection from this subnet except to
  # the destinations it is given (DOCKER-USER chain).
  edge:
    ipam: { config: [{ subnet: "${EDGE_SUBNET:-172.30.0.0/24}" }] }
  # Grafana and its query backends (Prometheus, Tempo, Loki): plain HTTP, metrics only.
  obs:
    internal: true
  # llama.cpp has no TLS: it shares this network with the proxy alone, which serves it over
  # TLS to the backend.
  llm:
    internal: true

volumes:
  pgdata:
  pgbackrest:
  s3data:
  dagsterhome:
  certs:
  ca:
  models:
  tempo:
  ollama:

# ---------------------------------------------------------------- shared settings
x-certs: &ca-only
  # The CA certificate alone, for clients. Servers mount their own folder (see each service).
  type: volume
  source: certs
  target: /certs
  read_only: true
  volume: { subpath: client }

x-python-env: &python-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD:?run make secrets}@postgres:5432/${POSTGRES_DB}
  PGSSLMODE: verify-full
  PGSSLROOTCERT: /certs/ca.crt
  # Python HTTPS clients (S3, Keycloak keys, LLM, OTLP) trust the stack CA, and only it.
  SSL_CERT_FILE: /certs/ca.crt
  S3_ENDPOINT: https://s3:9000
  S3_ACCESS_KEY: ${S3_ROOT_USER}
  S3_SECRET_KEY: ${S3_ROOT_PASSWORD:?run make secrets}
  OIDC_ISSUER: https://keycloak:8443/auth/realms/wells
  OLLAMA_URL: ${LLM_URL}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_CERTIFICATE: /certs/ca.crt
  # LLM calls: per-call timeout and output cap (a small model on a CPU needs both).
  LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-300}
  LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
  RT_EXPLAIN_TIMEOUT_S: ${RT_EXPLAIN_TIMEOUT_S:-30}
  LLM_BACKEND: ${LLM_BACKEND:-none}
  LLM_URL: ${LLM_URL:-}
  LLM_MODEL: ${LLM_MODEL:-}
  EMBED_BACKEND: ${EMBED_BACKEND:-hash}
  EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
  # Traces only (Tempo); metrics go to Prometheus over /metrics.
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  # Models are side-loaded into the `models` volume; nothing is fetched at run time.
  HF_HOME: /models/hf
  HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}

x-python: &python
  restart: unless-stopped
  environment: *python-env
  networks: [backend]
  depends_on: &python-deps
    init: { condition: service_completed_successfully }
    postgres: { condition: service_healthy }
    s3: { condition: service_healthy }

x-python-build: &python-build
  context: .
  dockerfile: infra/python.Dockerfile

services:
  # One-shot: private CA + one certificate per service (infra/tls/certs.py). Idempotent.
  init:
    build: { <<: *python-build, args: { PACKAGE: api } }
    user: root
    network_mode: none
    restart: "no"
    command: python /repo/infra/tls/certs.py --ca /ca --out /certs
    environment:
      TLS_EXTRA_SANS: ${TLS_EXTRA_SANS:-}
    volumes:
      - certs:/certs
      - ca:/ca
      - models:/models  # side-loading models: docs/operations/edge.md

  # ------------------------------------------------------------ data
  postgres:
    # PostgreSQL 17 + TimescaleDB + PostGIS + pgvector + pgBackRest in one image. ADR-0001.
    image: timescale/timescaledb-ha:pg17
    restart: unless-stopped
    networks: [backend]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make secrets}
      POSTGRES_DB: ${POSTGRES_DB}
      PGBACKREST_CONFIG: /etc/pgbackrest/wells.conf
      PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_CIPHER_PASS:?run make secrets}
    # TLS only (pg_hba rejects plain TCP), WAL archived to pgBackRest (infra/postgres).
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/tls.crt
      - -c
      - ssl_key_file=/certs/tls.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=wells archive-push %p
      - -c
      - archive_timeout=300
      - -c
      - log_connections=on
    volumes:
      - pgdata:/home/postgres/pgdata
      - pgbackrest:/var/lib/pgbackrest
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./infra/postgres/pgbackrest.conf:/etc/pgbackrest/wells.conf:ro
      - { type: volume, source: certs, target: /certs, read_only: true, volume: { subpath: postgres } }
    depends_on:
      init: { condition: service_completed_successfully }
    healthcheck:
      # TCP, not the socket: the init-phase server listens on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # S3-compatible object store for source PDFs and recordings: SeaweedFS (Apache-2.0; MinIO
  # stopped publishing images). S3 over TLS on 9000 with one identity from the environment;
  # its master, volume and filer listen on the container's loopback only (no unauthenticated
  # access from the network).
  s3:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    networks: [backend]
    entrypoint: ["sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ROOT_USER" "$$S3_ROOT_PASSWORD" > /tmp/s3.json
        && exec weed server -dir=/data -ip=127.0.0.1 -ip.bind=127.0.0.1 -volume.max=0
        -master.volumeSizeLimitMB=1024 -s3 -s3.ip.bind=0.0.0.0 -s3.port=9000
        -s3.port.iceberg=0 -s3.port.lance=0 -s3.config=/tmp/s3.json
        -s3.cert.file=/certs/tls.crt -s3.key.file=/certs/tls.key
    environment:
      S3_ROOT_USER: ${S3_ROOT_USER}
      S3_ROOT_PASSWORD: ${S3_ROOT_PASSWORD:?run make secrets}
    volumes:
      - s3data:/data
      - { type: volume, source: certs, target: /certs, read_only: true, volume: { subpath: s3 } }
    depends_on:
      init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9333/cluster/status | grep -q IsLeader && curl -s -o /dev/null --cacert /certs/ca.crt https://localhost:9000/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ------------------------------------------------------------ identity
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    restart: unless-stopped
    networks: [backend]
    command: start --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run make secrets}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak?sslmode=verify-full&sslrootcert=/certs/ca.crt
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?run make secrets}
      # Browsers reach it through the proxy at <web origin>/auth; services at keycloak:8443/auth.
      KC_HOSTNAME: https://${PUBLIC_HOST}:${WEB_PORT}/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_PORT: "8443"
      KC_HTTPS_CERTIFICATE_FILE: /certs/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /certs/tls.key
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # Health and metrics only, on the internal network; scraped and probed in plain HTTP.
      KC_HTTP_MANAGEMENT_SCHEME: http
      # Placeholders in infra/keycloak/realm.json
      PUBLIC_HOST: ${PUBLIC_HOST}
      WEB_PORT: ${WEB_PORT}
      EDGE_SYNC_CLIENT_SECRET: ${EDGE_SYNC_CLIENT_SECRET}
    volumes:
      - ./infra/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
      - { type: volume, source: certs, target: /certs, read_only: true, volume: { subpath: keycloak } }
    depends_on:
      init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    healthcheck:
      # Image has no curl/wget; use bash /dev/tcp against the management port.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  # ------------------------------------------------------------ application
  api:
    <<: *python
    build:
      <<: *python-build
      # libgomp1: OpenMP runtime for XGBoost / scikit-learn (real-time detectors);
      # ffmpeg + the speech extra: spoken questions to the assistant (faster-whisper).
      args: { PACKAGE: api, APT_PACKAGES: libgomp1 ffmpeg, EXTRAS: --extra speech }
    environment:
      <<: *python-env
      RT_STALE_AFTER_S: ${RT_STALE_AFTER_S}
      RT_DETECTORS: ${RT_DETECTORS}
      WEB_ORIGINS: https://${PUBLIC_HOST}:${WEB_PORT}
      EMBED_BACKEND: ${EMBED_BACKEND}
      EMBED_MODEL: ${EMBED_MODEL}
      WHISPER_MODEL: ${WHISPER_MODEL}
      ASSISTANT_DRAFTER: ${ASSISTANT_DRAFTER:-llm}
      # Tokens carry the public issuer; keys are fetched inside the network.
      OIDC_ISSUER_PUBLIC: https://${PUBLIC_HOST}:${WEB_PORT}/auth/realms/wells
      OIDC_JWKS_URL: https://keycloak:8443/auth/realms/wells/protocol/openid-connect/certs
      OIDC_AUDIENCE: api
      LLM_BACKEND: ${LLM_BACKEND}
      LLM_URL: ${LLM_URL}
      LLM_MODEL: ${LLM_MODEL}
      OTEL_TRACES_SAMPLER: parentbased_always_on
    # Migrate to head on every start (idempotent), then serve over TLS.
    command: >-
      sh -c "alembic -c apps/api/alembic.ini upgrade head
      && uvicorn api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --root-path /api
      --ssl-certfile /tls/tls.crt --ssl-keyfile /tls/tls.key"
    volumes:
      - *ca-only
      - { type: volume, source: certs, target: /tls, read_only: true, volume: { subpath: api } }
      - "./data/models:/repo/data/models:ro"
      - models:/models:ro
    depends_on:
      <<: *python-deps
      keycloak: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('https://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # One origin: the proxy serves the API at /api and Keycloak at /auth.
        VITE_API_URL: "https://${PUBLIC_HOST}:${WEB_PORT}/api"
        VITE_OIDC_ISSUER: "https://${PUBLIC_HOST}:${WEB_PORT}/auth/realms/wells"
    restart: unless-stopped
    networks: [backend]
    volumes:
      - { type: volume, source: certs, target: /certs, read_only: true, volume: { subpath: web } }
    depends_on:
      init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://127.0.0.1:8443/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The only service with published ports. TLS in, TLS to every upstream (infra/caddy).
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    networks: [edge, backend, llm]
    environment:
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-0}
      PUBLIC_HOST: ${PUBLIC_HOST}
      WEB_PORT: ${WEB_PORT}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${WEB_PORT}:5173"
      - "${BIND_ADDR:-0.0.0.0}:${GRAFANA_PORT}:3000"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - { type: volume, source: certs, target: /certs, read_only: true, volume: { subpath: proxy } }
    depends_on:
      init: { condition: service_completed_successfully }
      web: { condition: service_healthy }
      api: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate --header \"Host: $$PUBLIC_HOST\" https://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------ ingestion (hq)
  dagster:
    <<: *python
    profiles: [hq]
    build:
      <<: *python-build
      args:
        PACKAGE: pipelines
        EXTRAS: --extra ocr --extra speech
        APT_PACKAGES: libgl1 libglib2.0-0 libgomp1 ffmpeg
    # ponytail: `dagster dev` (webserver + daemon, SQLite run storage in the volume). Split into
    # webserver/daemon with Postgres storage when pipelines run unattended.
    # The UI has no login: it listens on the container's loopback only (docker-compose.dev.yml
    # opens it on the laptop). Operators reach it with `docker compose exec` or an SSH tunnel.
    command: dagster dev -h 127.0.0.1 -p 3000 -m pipelines
    environment:
      <<: *python-env
      DAGSTER_HOME: /opt/dagster
      PIPELINE_WORK_DIR: /opt/dagster/work
      LLM_BACKEND: ${LLM_BACKEND}
      LLM_URL: ${LLM_URL}
      LLM_MODEL: ${LLM_MODEL}
      VLM_MODEL: ${VLM_MODEL}
      WHISPER_MODEL: ${WHISPER_MODEL}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD}
      SECOND_PASS: ${SECOND_PASS}
      OTEL_TRACES_SAMPLER: parentbased_always_on
      # Daily Sodir FactPages sync (public wells + new completion reports): pipelines/sodir.py.
      SODIR_SYNC: ${SODIR_SYNC:-1}
      SODIR_REPORTS_PER_RUN: ${SODIR_REPORTS_PER_RUN:-3}
    volumes:
      - *ca-only
      - dagsterhome:/opt/dagster
      - ./infra/dagster/dagster.yaml:/opt/dagster/dagster.yaml:ro
      - models:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:3000/server_info')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ------------------------------------------------------------ real time
  # Demo: a WITSML 1.4.1.1 simulator replays a seeded synthetic wellbore over TLS; the real-time
  # service polls it like a rig's WITSML store. `make realtime` (after `make seed`).
  witsml-sim:
    <<: *python
    profiles: [realtime]
    build: { <<: *python-build, args: { PACKAGE: api, APT_PACKAGES: libgomp1 } }
    command: >-
      sh -c "python -m api.realtime simulate --source synthetic --speed ${RT_SIM_SPEED}
      --wellbore-id ${RT_WELLBORE_ID} --port 8090 --tls-cert /tls/tls.crt --tls-key /tls/tls.key"
    volumes:
      - *ca-only
      - { type: volume, source: certs, target: /tls, read_only: true, volume: { subpath: witsml-sim } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('https://localhost:8090/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  realtime:
    <<: *python
    profiles: [realtime, edge]
    build: { <<: *python-build, args: { PACKAGE: api, APT_PACKAGES: libgomp1 } }
    networks: [backend, edge]
    environment:
      <<: *python-env
      LLM_BACKEND: ${LLM_BACKEND}
      LLM_URL: ${LLM_URL}
      LLM_MODEL: ${LLM_MODEL}
      RT_METRICS_PORT: "9464"
      TLS_CERT_FILE: /tls/tls.crt
      TLS_KEY_FILE: /tls/tls.key
      # One trace in 20 samples; alert raises are events on the sampled spans.
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "0.05"
    command: >-
      python -m api.realtime run --wellbore-id ${RT_WELLBORE_ID} --connector witsml
      --url ${RT_WITSML_URL} --interval 2 --detectors ${RT_DETECTORS}
    # Trained detectors (make rt-models); without them the service runs physics rules only.
    volumes:
      - *ca-only
      - { type: volume, source: certs, target: /tls, read_only: true, volume: { subpath: realtime } }
      - "./data/models:/repo/data/models:ro"
      - models:/models:ro  # rig box: the bank from the hazard package (/models/realtime)
    depends_on:
      <<: *python-deps
      api: { condition: service_healthy }

  # ------------------------------------------------------------ Rig Edge Pack (edge)
  # Small model for offline chat and alert explanations, served over TLS by the proxy
  # (https://proxy:8081, LLM_BACKEND=vllm). The GGUF file is side-loaded: docs/operations/edge.md.
  llm:
    profiles: [edge]
    image: ghcr.io/ggml-org/llama.cpp:server  # pin by digest when the rig image is frozen
    restart: unless-stopped
    networks: [llm]
    command: >-
      -m /models/llm/${EDGE_LLM_MODEL_FILE} --host 0.0.0.0 --port 8080 -c 8192 --jinja
      --alias ${LLM_MODEL}
    volumes: [models:/models:ro]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Uploads rig records (alerts, acknowledgements, shelves, feedback, voice notes, audit) to
  # headquarters when the VSAT link is up, and pulls a fresh hazard package.
  edge-sync:
    <<: *python
    profiles: [edge]
    build: { <<: *python-build, args: { PACKAGE: api } }
    networks: [backend, edge]
    environment:
      <<: *python-env
      HQ_URL: ${HQ_URL}
      HQ_TOKEN_URL: ${HQ_TOKEN_URL}
      EDGE_ID: ${EDGE_ID}
      EDGE_SYNC_CLIENT_ID: ${EDGE_SYNC_CLIENT_ID:-edge-sync}
      EDGE_SYNC_CLIENT_SECRET: ${EDGE_SYNC_CLIENT_SECRET}
      EDGE_WELLBORE_ID: ${RT_WELLBORE_ID}
      # HQ's CA (or the corporate root) for the uplink: /ca/trust, see docs/operations/edge.md
      HQ_CA_FILE: /certs/ca.crt
      # The package's detector bank goes here; realtime reads it (RT_DETECTORS on the rig box).
      EDGE_MODELS_DIR: /models/realtime
    command: python -m api.edge agent --interval 60
    volumes:
      - *ca-only
      - models:/models

  # ------------------------------------------------------------ observability (hq)
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [hq, edge]
    restart: unless-stopped
    networks: [backend, obs]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - { type: volume, source: certs, target: /certs, read_only: true, volume: { subpath: prometheus } }
    depends_on:
      init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  tempo:
    image: grafana/tempo:2.8.2
    profiles: [hq]
    restart: unless-stopped
    networks: [backend, obs]
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./infra/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo:/var/tempo
      - { type: volume, source: certs, target: /certs, read_only: true, volume: { subpath: tempo } }
    depends_on:
      init: { condition: service_completed_successfully }

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [hq, edge]
    restart: unless-stopped
    networks: [backend, obs]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run make secrets}
      GF_SERVER_PROTOCOL: https
      GF_SERVER_CERT_FILE: /certs/tls.crt
      GF_SERVER_CERT_KEY: /certs/tls.key
      GF_SERVER_ROOT_URL: https://${PUBLIC_HOST}:${GRAFANA_PORT}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - { type: volume, source: certs, target: /certs, read_only: true, volume: { subpath: grafana } }
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--cacert", "/certs/ca.crt", "https://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  loki:
    image: grafana/loki:3.5.0  # ships busybox in /busybox for the health check
    profiles: [hq]
    restart: unless-stopped
    networks: [obs]
    healthcheck:
      test: ["CMD", "/busybox/wget", "-q", "--spider", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # ------------------------------------------------------------ tools
  # One-shot jobs on the api image with the repository's data/ mounted: loading the synthetic
  # truth, training the detectors, the demo replay (make demo; docs/demo.md).
  apitools:
    <<: *python
    profiles: [tools]
    build: { <<: *python-build, args: { PACKAGE: api, APT_PACKAGES: libgomp1 } }
    user: root  # writes data/models on the host
    restart: "no"
    environment:
      <<: *python-env
      LLM_BACKEND: ${LLM_BACKEND}
      LLM_URL: ${LLM_URL}
      LLM_MODEL: ${LLM_MODEL}
      EMBED_BACKEND: ${EMBED_BACKEND}
      EMBED_MODEL: ${EMBED_MODEL}
    volumes:
      - *ca-only
      - "./data:/repo/data"
    command: ["python", "-c", "print('docker compose run --rm apitools <command>')"]

  # One-shot job for `make seed`: generates synthetic wells (and, on a laptop with
  # docker-compose.dev.yml, downloads public data), registers everything in the object store + Postgres.
  datatools:
    profiles: [tools]
    build: { <<: *python-build, args: { PACKAGE: datatools, APT_PACKAGES: espeak-ng } }
    user: root  # writes data/raw on the host
    networks: [backend]
    working_dir: /repo/data
    command: python seed.py
    environment:
      <<: *python-env
      VOLVE_SAS_URL: ${VOLVE_SAS_URL}
      VOLVE_DIR: ${VOLVE_DIR}
    volumes:
      - *ca-only
      - "./data:/repo/data"  # outputs land in data/raw on the host
    depends_on: *python-deps
