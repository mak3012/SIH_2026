# TLS only. The local socket serves the image's init scripts and pgBackRest inside the
# container; every network connection must use TLS and SCRAM (plain TCP is rejected).
# TYPE     DATABASE  USER  ADDRESS     METHOD
local      all       all               trust
hostssl    all       all   0.0.0.0/0   scram-sha-256
hostssl    all       all   ::/0        scram-sha-256
hostnossl  all       all   0.0.0.0/0   reject
hostnossl  all       all   ::/0        reject
