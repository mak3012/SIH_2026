# pgBackRest for the `wells` cluster (docs/operations/runbooks/db-restore.md).
# Repository: the `pgbackrest` volume, encrypted (PGBACKREST_REPO1_CIPHER_PASS from the
# environment). Production adds an off-site copy as repo2 (S3 or a second host), e.g.:
#   repo2-type=s3  repo2-s3-endpoint=...  repo2-s3-bucket=...  repo2-cipher-type=aes-256-cbc
[global]
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full=4
repo1-retention-diff=7
compress-type=zst
start-fast=y
process-max=2
log-level-console=info
log-level-file=detail

[wells]
pg1-path=/home/postgres/pgdata/data
