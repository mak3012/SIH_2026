# Traces from the API, the real-time service and the pipelines (OTLP over HTTPS, port 4318).
# Grafana queries it on the observability network (port 3200).
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
          tls:
            cert_file: /certs/tls.crt
            key_file: /certs/tls.key

storage:
  trace:
    backend: local
    local: { path: /var/tempo/traces }
    wal: { path: /var/tempo/wal }

compactor:
  compaction:
    block_retention: 336h  # 14 days
