# Static PWA over TLS (the proxy in front adds the security headers and the public certificate).
server {
    listen 8443 ssl;
    http2 on;
    ssl_certificate     /certs/tls.crt;
    ssl_certificate_key /certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    server_tokens off;
    root /usr/share/nginx/html;

    # Hashed assets never change; the shell and the service worker must always revalidate.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    # nginx's mime.types has no .mjs: served as octet-stream (with nosniff at the proxy) the
    # browser refuses the module workers (MapLibre, PDF.js).
    location ~ ^/assets/.+\.mjs$ {
        types { }
        default_type text/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
