site_name: Well Intelligence
dev_addr: 127.0.0.1:8001
theme:
  name: material
  features: [navigation.sections, navigation.top, search.highlight, content.code.copy]
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - def_list
  - toc: { permalink: true }
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview: index.md
  - User guide: guide.md
  - Windows setup: setup-windows.md
  - SIH demo: demo.md
  - FAQ: faq.md
  - Architecture: architecture.md
  - Data: data.md
  - Data model: data-model.md
  - Canonical depth: canonical-depth.md
  - Pipelines: pipelines.md
  - Intelligence: intelligence.md
  - Real-time: realtime.md
  - Assistant: assistant.md
  - API: api.md
  - UI:
      - ui.md
      - Screens and user guides: ui/screens.md
      - Design system: ui/design-system.md
  - Security: security.md
  - Operations:
      - operations/index.md
      - Rig Edge Pack: operations/edge.md
      - Runbooks:
          - Stale feed: operations/runbooks/stale-feed.md
          - LLM down: operations/runbooks/llm-down.md
          - Database restore: operations/runbooks/db-restore.md
          - Model rollback: operations/runbooks/model-rollback.md
  - Evaluation: evaluation.md
  - ADRs:
      - adr/index.md
      - "0001 One PostgreSQL": adr/0001-one-postgresql.md
      - "0002 Rules decide, LLM explains": adr/0002-rules-decide-llm-explains.md
      - "0003 Roles separate duties": adr/0003-roles-separate-duties.md
      - "0004 Rig sync through the API": adr/0004-rig-sync-through-the-api.md
  - Licences: licences.md
  - Glossary: glossary.md

validation:
  anchors: warn
